<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="scalableTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="currentColor" stop-opacity=".47"/>
      <stop offset="1" stop-color="currentColor" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="scalableLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="currentColor" stop-opacity=".27"/>
      <stop offset="1" stop-color="currentColor" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="scalableRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="currentColor" stop-opacity=".19"/>
      <stop offset="1" stop-color="currentColor" stop-opacity=".09"/>
    </linearGradient>
    <filter id="scalableGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- Three equal cubes aligned on a single isometric grid.
       The lower edges of the upper cube are intentionally not stroked. -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="4" opacity=".20" filter="url(#scalableGlow)">
      <path d="M80 36 L120 14 L160 36 L120 58 Z M80 36 V88 M120 58 V110 M160 36 V88"/>
      <path d="M40 110 L80 88 M40 110 L80 132 L120 110 M40 110 V162 L80 184 L120 162 V110 M80 132 V184"/>
      <path d="M160 88 L200 110 L160 132 L120 110 M200 110 V162 L160 184 L120 162 M160 132 V184"/>
    </g>
  </g>

  <!-- Solid faces are drawn without individual borders so shared edges
       appear only once and no hidden bottom edges show through. -->
  <g>
    <!-- Upper cube -->
    <path d="M80 36 L120 14 L160 36 L120 58 Z" fill="url(#scalableTop)"/>
    <path d="M80 36 L120 58 V110 L80 88 Z" fill="url(#scalableLeft)"/>
    <path d="M120 58 L160 36 V88 L120 110 Z" fill="url(#scalableRight)"/>

    <!-- Left bottom cube -->
    <path d="M40 110 L80 88 L120 110 L80 132 Z" fill="url(#scalableTop)"/>
    <path d="M40 110 L80 132 V184 L40 162 Z" fill="url(#scalableLeft)"/>
    <path d="M80 132 L120 110 V162 L80 184 Z" fill="url(#scalableRight)"/>

    <!-- Right bottom cube -->
    <path d="M120 110 L160 88 L200 110 L160 132 Z" fill="url(#scalableTop)"/>
    <path d="M120 110 L160 132 V184 L120 162 Z" fill="url(#scalableLeft)"/>
    <path d="M160 132 L200 110 V162 L160 184 Z" fill="url(#scalableRight)"/>
  </g>

  <!-- Visible borders only: the upper cube has no bottom outline. -->
  <g stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 36 L120 14 L160 36 L120 58 Z"/>
    <path d="M80 36 V88 M120 58 V110 M160 36 V88"/>

    <!-- Left base cube: omit the segment shared with the upper cube -->
    <path d="M40 110 L80 88 M40 110 L80 132 L120 110"/>
    <path d="M40 110 V162 L80 184 L120 162 V110 M80 132 V184"/>

    <!-- Right base cube: omit the segment shared with the upper cube -->
    <path d="M160 88 L200 110 L160 132 L120 110"/>
    <path d="M200 110 V162 L160 184 L120 162 M160 132 V184"/>
  </g>
</svg>
