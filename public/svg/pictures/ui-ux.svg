<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 240 200"
  fill="none"
>
  <defs>
    <linearGradient id="uiFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="currentColor" stop-opacity=".65" />
      <stop offset="1" stop-color="currentColor" stop-opacity=".12" />
    </linearGradient>

    <filter id="uiGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>

  <g
    stroke="currentColor"
    stroke-width="5"
    opacity=".55"
    filter="url(#uiGlow)"
  >
    <rect x="15" y="15" width="210" height="27" rx="8" />
    <rect x="15" y="54" width="116" height="131" rx="11" />
    <rect x="143" y="54" width="82" height="57" rx="10" />
    <rect x="143" y="123" width="82" height="62" rx="10" />
  </g>

  <g fill="url(#uiFill)" stroke="currentColor" stroke-width="1.5">
    <rect x="15" y="15" width="210" height="27" rx="8" />
    <rect x="15" y="54" width="116" height="131" rx="11" />
    <rect x="143" y="54" width="82" height="57" rx="10" />
    <rect x="143" y="123" width="82" height="62" rx="10" />
  </g>
</svg>