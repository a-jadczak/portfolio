query PortfolioProjects {
  viewer {
    pinnedItems(first: 6, types: REPOSITORY) {
      nodes {
        ... on Repository {
          id
          name
        }
      }
    }

    repositories(first: 50, orderBy: { field: UPDATED_AT, direction: DESC }) {
      nodes {
        id
        name
        description
        homepageUrl
        url
        createdAt

        licenseInfo {
          name
          spdxId
        }

        owner {
          login
        }

        defaultBranchRef {
          name
        }

        metadata: object(expression: "HEAD:.github/portfolio.yaml") {
          ... on Blob {
            text
          }
        }

        readme: object(expression: "HEAD:README.md") {
          ... on Blob {
            text
          }
        }
      }
    }
  }
}
