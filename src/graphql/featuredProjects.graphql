query FeaturedProjects {
  viewer {
    pinnedItems(first: 3, types: REPOSITORY) {
      nodes {
        ... on Repository {
          name
          description
          url
          owner {
            login
          }
          defaultBranchRef {
            name
          }
          metadata: object(expression: "HEAD:.github/portfolio.yaml") {
            ... on Blob {
              text
            }
          }
        }
      }
    }
  }
}
